<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>limonchelli adventures</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login-Bereich -->
    <div id="login-box">
        <h2>Passwort:</h2>
        <input type="password" id="password-input" placeholder="Passwort">
        <button onclick="checkPassword()">Einloggen</button>
        <p id="error-message"></p>
    </div>
    <!-- Geheimer Inhalt -->
    <div id="secret-content" class="hidden">
        <!-- Ersetzen Sie 'ihr-bild.jpg' mit dem Link zu Ihrem Foto -->
        <img src="limonchello.jpeg" alt="Limonchelli Adventures Banner" style="width:60%; max-width:1200px; height:auto; border-radius: 12px;">
        <h1>Willkommen zu den limonchelli adventures !</h1>
        <div class="navigation-container">
            <a href="abenteuer.html" class="btn-adventure">Zu den Abenteuern</a>
        </div>
    </div>
    <!-- Container für die fallenden Emojis -->
    <div id="emoji-rain"></div>

    <script>
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            // Ersetze 'hariksee' durch dein Wunschpasswort
            if (input === 'hariksee') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('secret-content').classList.remove('hidden');
                startEmojiRain();
            } else {
                document.getElementById('error-message').innerText = 'Falsches Passwort!';
            }
        }

        function startEmojiRain() {
            const emojis = ['🍋', '🍹', '🌿', '☀️', '🎉', '🍸'];
            const container = document.getElementById('emoji-rain');
            const totalEmojis = 40;
            const durationMs = 6000; // Regen läuft 6 Sekunden

            for (let i = 0; i < totalEmojis; i++) {
                setTimeout(() => {
                    const span = document.createElement('span');
                    span.className = 'falling-emoji';
                    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    span.style.left = Math.random() * 100 + 'vw';
                    span.style.fontSize = (18 + Math.random() * 22) + 'px';
                    span.style.animationDuration = (3 + Math.random() * 2.5) + 's';
                    container.appendChild(span);

                    // Element nach Ende der Animation wieder entfernen
                    span.addEventListener('animationend', () => span.remove());
                }, Math.random() * durationMs);
            }
        }
    </script>
</body>
</html>
