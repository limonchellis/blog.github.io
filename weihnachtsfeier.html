<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weihnachtsfeier</title>
    <link rel="stylesheet" href="style.css"> <!-- Gleiches Design nutzen -->
</head>
<body>
    <header>
        <h1>Willkommen bei den Abenteuern der Limonchellis!</h1>
        <a href="abenteuer.html">← Zurück zu allen Abenteuern</a>
    </header>
    <main>
        <h2>Die Weihnachtsfeier steht an!</h2>
        <!-- Container für die Nebeneinander-Ausrichtung -->
        <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center;">
            <!-- TODO: Bild ersetzen, sobald hochgeladen -->
            <img src="weihnachtsfeier-placeholder.jpg" alt="Weihnachtsfeier" style="width: 30%; min-width: 220px; max-width: 1200px; height: auto; border-radius: 12px;">
            <!-- Event-Info: Datum & Ort -->
            <div class="event-card">
                <span class="event-date">📅 28.11.2026</span>
                <span class="divider"></span>
                <span class="event-location">📍 Ort folgt</span>
            </div>
            <p style="max-width: 500px; text-align: left;">Es wird festlich! Details zur Weihnachtsfeier folgen in Kürze – bleibt gespannt.</p>
        </div>
    </main>

    
    <script>
    function startEmojiRain() {
            const emojis = ['🎄','🎅','🎁','⛄','❄️','🔔'];
            const container = document.getElementById('emoji-rain');
            const totalEmojis = 40;
            const durationMs = 6000; // Regen läuft 6 Sekunden

            for (let i = 0; i < totalEmojis; i++) {
                setTimeout(() => {
                    const span = document.createElement('span');
                    span.className = 'falling-emoji';
                    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    span.style.left = Math.random() * 100 + 'vw';
                    span.style.fontSize = (18 + Math.random() * 22) + 'px';
                    span.style.animationDuration = (3 + Math.random() * 2.5) + 's';
                    container.appendChild(span);

                    // Element nach Ende der Animation wieder entfernen
                    span.addEventListener('animationend', () => span.remove());
                }, Math.random() * durationMs);
            }
    </script>
</body>
</html>
